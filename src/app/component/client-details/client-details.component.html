<div class="card">
  <div class="header flex justify-content-between align-items-center mb-2">
    <h2>List of Client Details</h2>
    <p-button label="Create Clients" [raised]="true" severity="success" (click)="navigateTo('client/create')">
      <i class="pi pi-plus"></i>
    </p-button>
  </div>

  <div class="mb-3" style="max-width: 500px;">
    <div class="flex gap-2">
      <p-iconfield style="flex: 1;">
        <p-inputicon class="pi pi-search"></p-inputicon>
        <input
          type="text"
          pInputText
          placeholder="Search by Client"
          (input)="dt1.filterGlobal($event.target.value, 'contains')"
        />
      </p-iconfield>
    </div>
  </div>

  <div class="table-responsive">
    <p-table
      #dt1
      [value]="clientList"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [globalFilterFields]="['companyName']"
      [scrollable]="true"
      [responsiveLayout]="'scroll'">

      <ng-template pTemplate="header">
        <tr>
          <th>Action</th>
          <th pSortableColumn="companyName">Company Name
            <p-sortIcon field="companyName"></p-sortIcon>
          </th>
          <th pSortableColumn="email">Company Email
            <p-sortIcon field="email"></p-sortIcon>
          </th>
          <th pSortableColumn="contactNumber">Contact
            <p-sortIcon field="contactNumber"></p-sortIcon>
          </th>
          <th pSortableColumn="hiringContactPerson">Hiring Contact Person
            <p-sortIcon field="hiringContactPerson"></p-sortIcon>
          </th>
          <th pSortableColumn="billingContactPerson">Billing Contact Person
            <p-sortIcon field="billingContactPerson"></p-sortIcon>
          </th>
        </tr>
      </ng-template>

      <!-- Table Body -->
      <ng-template pTemplate="body" let-client>
        <tr (click)="navigateToView(client.id)" class="tr-hover">
          <td (click)="$event.stopPropagation()">
            <button
              pButton
              type="button"
              icon="pi pi-cog"
              class="p-button-rounded p-button-text"
              (click)="menu.toggle($event)"
            ></button>
            <p-menu
              #menu
              [popup]="true"
              [model]="client.items"
              appendTo="body"
            ></p-menu>
          </td>
          <td>
            <div class="truncate-text">{{ client.companyName }}</div>
          </td>
          <td>
            <div class="truncate-text">{{ client.email }}</div>
          </td>
          <td>
            <div class="truncate-text">{{ client.contactNumber }}</div>
          </td>
          <td>
            <div class="truncate-text">{{ client.hiringContactPerson }}</div>
          </td>
          <td>
            <div class="truncate-text">{{ client.billingContactPerson }}</div>
          </td>

        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8">No candidates found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
