<h2>Dashboard Overview</h2>
<p-panel>
  <div class="grid">
    <div class="col-12 md:col-3" *ngFor="let card of summaryCards()">
      <p-card class="summary-card" [styleClass]="card.color">
        <div class="flex justify-content-between align-items-center">
          <div>
            <h3>{{ card.title }}</h3>
            <h2>{{ card.value }}</h2>
          </div>
          <i class="{{ card.icon }} text-4xl"></i>
        </div>
      </p-card>
    </div>
  </div>
</p-panel>
